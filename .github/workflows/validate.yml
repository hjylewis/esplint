# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Validation CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        eslint-version: [7, 8, 9]
        # Test against Current, Active LTS and Maintenance LTS lines: https://nodejs.org/en/about/previous-releases

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Install ESLint ${{ matrix.eslint-version }}
      run: npm install --no-save eslint@${{ matrix.eslint-version }}
    - run: npm test -- --coverage
    - uses: codecov/codecov-action@v4
